<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Montaje">
  <meta name="description" content="Editor de vídeo multipista para el móvil">
  <title>Montaje</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <section id="home" class="screen">
    <header class="topbar">
      <div class="brand"><img src="icons/icon-192.png" alt="" width="32" height="32"><h1>Montaje</h1></div>
    </header>
    <main id="project-list" class="project-list"></main>
    <button id="btn-new" class="fab"><span>+</span> Nuevo proyecto</button>
  </section>

  <section id="editor" class="screen hidden">
    <header class="topbar">
      <button class="icon-btn" id="btn-close" aria-label="Volver"></button>
      <button class="project-name" id="btn-rename"></button>
      <div class="spacer"></div>
      <button class="icon-btn" id="btn-undo" aria-label="Deshacer"></button>
      <button class="icon-btn" id="btn-redo" aria-label="Rehacer"></button>
      <button class="primary-btn" id="btn-export">Exportar</button>
    </header>
    <div id="preview-wrap"><canvas id="preview"></canvas></div>
    <div id="transport">
      <span id="time" class="time">0:00.0 / 0:00.0</span>
      <div class="transport-mid">
        <button class="icon-btn" id="btn-start" aria-label="Al principio"></button>
        <button class="icon-btn play" id="btn-play" aria-label="Reproducir"></button>
        <button class="icon-btn" id="btn-split" aria-label="Dividir"></button>
      </div>
      <div class="transport-right">
        <button class="icon-btn small" id="btn-zoom-out" aria-label="Alejar"></button>
        <button class="icon-btn small" id="btn-zoom-in" aria-label="Acercar"></button>
      </div>
    </div>
    <div id="timeline"></div>
    <nav id="toolbar"></nav>
  </section>

  <div id="sheet-backdrop" class="hidden"><div id="sheet" role="dialog"></div></div>
  <div id="toast"></div>
  <div id="media-pool" aria-hidden="true"></div>
  <input type="file" id="file-input" multiple hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
